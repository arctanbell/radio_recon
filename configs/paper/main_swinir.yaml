experiment:
  name: "paper_main_swinir"
  description: "Main SwinIR-style transformer configuration for paper-release evaluation"
  seed: 42

data:
  data_dir: "data/simobs"
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization:
    strategy: "independent"
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.5
    noise_sigma: 0.0

model:
  type: "swinir"
  in_channels: 3
  out_channels: 1
  embed_dim: 128
  depths: [8, 8, 8, 8]
  num_heads: [8, 8, 8, 8]
  window_size: 8
  mlp_ratio: 4.0

loss:
  type: "combined"
  components:
    - name: "mse"
      weight: 0.5
    - name: "l1"
      weight: 0.3
    - name: "fft"
      weight: 0.2

training:
  num_epochs: 220
  batch_size: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  min_lr: 0.000001
  val_interval: 5
  output_dir: "outputs/paper_main_swinir"
