experiment:
  name: "paper_architecture_film_unet"
  description: "FiLM-conditioned U-Net architecture comparison config"
  seed: 42

data:
  data_dir: "data/simobs"
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization:
    strategy: "independent"
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.5
    noise_sigma: 0.01

model:
  type: "conditional_unet_film"
  in_channels: 2
  out_channels: 1
  features: [64, 128, 256, 512]
  condition_dim: 256
  bilinear: true

loss:
  type: "combined"
  components:
    - name: "mse"
      weight: 0.4
    - name: "l1"
      weight: 0.3
    - name: "fft"
      weight: 0.2
    - name: "ssim"
      weight: 0.1

training:
  num_epochs: 150
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.00001
  min_lr: 0.000001
  val_interval: 5
  output_dir: "outputs/paper_architecture_film_unet"
