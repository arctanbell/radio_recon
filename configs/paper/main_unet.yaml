experiment:
  name: "paper_main_unet"
  description: "Main U-Net configuration for the paper-release repository"
  seed: 42

data:
  data_dir: "data/simobs"
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization:
    strategy: "independent"
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.5
    noise_sigma: 0.0

model:
  type: "simple_unet"
  in_channels: 3
  out_channels: 1
  features: [128, 256, 512, 1024]
  bilinear: true
  bottleneck_depth: 4

loss:
  type: "combined"
  components:
    - name: "mse"
      weight: 0.5
    - name: "l1"
      weight: 0.3
    - name: "fft"
      weight: 0.2

training:
  num_epochs: 260
  batch_size: 8
  learning_rate: 0.00005
  weight_decay: 0.00001
  min_lr: 0.0000005
  val_interval: 5
  output_dir: "outputs/paper_main_unet"
