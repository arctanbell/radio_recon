experiment:
  name: "paper_architecture_dncnn_dirty_only"
  description: "Generic DnCNN dirty-only baseline config"
  seed: 42

data:
  data_dir: "data/simobs"
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization:
    strategy: "independent"
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.5
    noise_sigma: 0.01

model:
  type: "dncnn"
  in_channels: 1
  out_channels: 1
  depth: 17
  features: 64
  residual: true

training:
  input_mode: "dirty_only"
  num_epochs: 80
  batch_size: 8
  learning_rate: 0.0001
  min_lr: 0.000001
  val_interval: 1
  output_dir: "outputs/paper_architecture_dncnn_dirty_only"
