experiment:
  name: "paper_architecture_dit_patch8"
  description: "DiT-style patch Transformer architecture comparison config"
  seed: 42

data:
  data_dir: "data/simobs"
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization:
    strategy: "independent"
  augmentation:
    enabled: true
    flip_prob: 0.5
    rotate_prob: 0.5
    noise_sigma: 0.01

model:
  type: "dit"
  in_channels: 3
  out_channels: 1
  image_size: 192
  patch_size: 8
  embed_dim: 384
  depth: 8
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.0

loss:
  type: "combined"
  components:
    - name: "mse"
      weight: 0.3
    - name: "l1"
      weight: 0.2
    - name: "fft"
      weight: 0.2
    - name: "gradient"
      weight: 0.15
    - name: "laplacian"
      weight: 0.15

training:
  num_epochs: 400
  batch_size: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr: 0.000001
  val_interval: 5
  output_dir: "outputs/paper_architecture_dit_patch8"
