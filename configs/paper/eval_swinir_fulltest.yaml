experiment:
  name: "paper_eval_swinir_fulltest"
  description: "Evaluation-only config for SwinIR checkpoints on the full unfiltered test split"
  seed: 42

data:
  data_dir: "data/simobs"
  num_workers: 4
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  normalization:
    strategy: "independent"
  augmentation:
    enabled: false
  filter:
    enabled: false

model:
  type: "swinir"
  in_channels: 3
  out_channels: 1
  embed_dim: 128
  depths: [8, 8, 8, 8]
  num_heads: [8, 8, 8, 8]
  window_size: 8
  mlp_ratio: 4.0

training:
  batch_size: 4
  num_epochs: 1
  learning_rate: 0.0001
  val_interval: 1
  output_dir: "outputs/paper_eval_swinir_fulltest"
