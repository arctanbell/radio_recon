[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radio_recon"
version = "0.1.0"
description = "Structure-aware radio interferometric image reconstruction models and reproducibility code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.21.0",
  "scipy>=1.7.0",
  "astropy>=5.0",
  "scikit-image>=0.19.0",
  "matplotlib>=3.5.0",
  "PyYAML>=6.0",
  "tqdm>=4.62.0",
]

[project.optional-dependencies]
torch = ["torch>=1.12.0", "torchvision>=0.13.0"]
dev = ["pytest>=7.0.0", "black>=22.0.0", "flake8>=4.0.0"]

[project.urls]
Repository = "https://github.com/arctanbell/radio_recon.git"
Paper = "paper/arxiv_paper.tex"

[tool.setuptools.packages.find]
include = ["radio_recon*"]
